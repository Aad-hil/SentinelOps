name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          SENTINELOPS_CHECKPOINT_BACKEND: memory
        run: pytest

      - name: Deterministic benchmark
        env:
          SENTINELOPS_CHECKPOINT_BACKEND: memory
        run: python -m evaluation.runner
