[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelops"
version = "0.1.0"
description = "AI-powered incident investigation and response platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Muhamed Aadhil" }
]
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "langgraph>=0.6,<1",
    "langgraph-checkpoint-postgres>=3.0.5,<3.1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "qdrant-client>=1.15",
    "sentence-transformers>=6.0,<7",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "simulator*",
    "agents*",
    "tools*",
    "rag*",
    "memory*",
    "recovery*",
    "safety*",
    "graph*",
    "evaluation*",
    "observability*",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 88
target-version = "py313"
