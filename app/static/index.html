<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SentinelOps — Investigation</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--panel2:#0c1422;--muted:#8d9ab0;--text:#f2f6fc;--line:#223149;--accent:#6ea8fe;--accent2:#9b8cff;--warn:#f4c95d;--good:#5ed6a0;--danger:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#172541 0,#080d18 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:rgba(8,13,24,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px clamp(20px,4vw,56px);display:flex;justify-content:space-between;align-items:center}
.brand{font-size:16px;font-weight:850;letter-spacing:.12em}.sub{color:var(--muted);font-size:12px;margin-top:3px}.online{color:var(--good);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}
main{width:min(1440px,calc(100% - 40px));margin:0 auto;padding:30px 0 64px}.toolbar{display:flex;gap:10px;margin-bottom:22px}.toolbar input{flex:1;min-width:0}
input,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#0d1626;color:var(--text)}input:focus{outline:2px solid rgba(110,168,254,.25);border-color:var(--accent)}button{cursor:pointer;background:linear-gradient(180deg,#1c3152,#15243d);font-weight:700;min-width:120px}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}
.incident-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:24px;margin-bottom:18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.incident-id{font-size:32px;line-height:1.1;margin:6px 0 5px}.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#493d16;color:var(--warn);font-size:11px;font-weight:800;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:18px}.card{background:linear-gradient(180deg,rgba(16,24,39,.98),rgba(12,20,34,.98));border:1px solid var(--line);border-radius:13px;padding:21px;box-shadow:0 8px 30px rgba(0,0,0,.12)}.wide{grid-column:1/-1}
h2{font-size:14px;margin:0 0 17px}.muted{color:var(--muted)}.error{color:var(--danger);margin:-8px 0 16px}.approval-card{border-color:#665522;background:linear-gradient(180deg,#171b25,#111724)}.approval-actions{display:flex;gap:10px;margin-top:16px}.approve,.reject{flex:1;font-weight:800}.approve{background:#163c31;border-color:#2e765e;color:var(--good)}.reject{background:#3b2024;border-color:#75414a;color:#ff9b9b}.reviewer{width:100%;margin-top:12px}.root-id{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em}.root-title{font-size:19px;font-weight:750;margin:6px 0 10px}.rationale{color:#c4cede;font-size:13px}
.confidence-row{display:flex;align-items:end;gap:12px;margin:20px 0 14px}.confidence{font-size:36px;font-weight:850;line-height:1}.confidence-label{font-size:11px;color:var(--muted);text-transform:uppercase}.progress{height:7px;background:#1b2639;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.fact{padding:13px;background:var(--panel2);border:1px solid #1c2940;border-radius:9px}.fact b{display:block;font-size:16px;margin-bottom:3px}.fact span{font-size:11px;color:var(--muted)}.ok{color:var(--good)}
.safety-decision{font-size:17px;font-weight:800}.risk{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:6px;background:#302914;color:var(--warn);font-size:11px;text-transform:uppercase;font-weight:800}.safety-text{font-size:13px;color:#c4cede;margin:12px 0}.approval{font-size:12px;color:var(--warn);font-weight:700}
.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:13px;background:var(--panel2);border:1px solid #1c2940;border-radius:9px}.step-num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#1c3150;color:var(--accent);font-size:11px;font-weight:800}.step-title{font-weight:700;font-size:13px}.step-purpose{font-size:11px;color:var(--muted);margin-top:3px}.badge{white-space:nowrap;font-size:10px;border-radius:6px;padding:4px 7px;background:#1b2535;color:#b7c3d6}.badge.warn{color:var(--warn);background:#302914}
.hypotheses{display:grid;gap:7px}.hypothesis{border:1px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden}.hypothesis summary{list-style:none;cursor:pointer;padding:13px 15px}.hypothesis summary::-webkit-details-marker{display:none}.hyp-head{display:grid;grid-template-columns:42px 1fr 48px;gap:10px;align-items:center}.hyp-id{color:var(--accent);font-weight:850}.hyp-statement{font-size:12px;font-weight:650}.hyp-score{text-align:right;font-weight:800;font-size:12px}.hyp-status{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase}.hyp-details{padding:0 15px 15px;border-top:1px solid var(--line);font-size:11px;color:#b9c5d6}.hyp-details p{margin:12px 0 5px;font-weight:700;color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:4px 6px;border-radius:5px;background:#182338;color:#aebbd0}.hyp-bar{height:4px;background:#1b2639;margin-top:9px;border-radius:99px;overflow:hidden}.hyp-bar span{display:block;height:100%;background:var(--accent)}
.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:520px;overflow:auto;padding-right:3px}.evidence-item{padding:13px;background:var(--panel2);border:1px solid #1c2940;border-radius:9px}.evidence-top{display:flex;justify-content:space-between;gap:8px}.type{font-size:10px;font-weight:850;color:var(--accent);text-transform:uppercase}.source{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.observation{font-size:12px;margin-top:7px}.time{font-size:10px;color:#68768d;margin-top:8px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.evidence{grid-template-columns:1fr}}@media(max-width:620px){header{padding:15px 18px}.sub{display:none}main{width:calc(100% - 24px);padding-top:18px}.toolbar{flex-direction:column}.toolbar button{width:100%}.incident-head{align-items:flex-start;flex-direction:column}.facts{grid-template-columns:1fr}.step{grid-template-columns:30px 1fr}.step .badge{grid-column:2;justify-self:start}.hyp-head{grid-template-columns:38px 1fr 42px}.incident-id{font-size:27px}}
</style></head>
<body>
<header><div><div class="brand">SENTINELOPS</div><div class="sub">AI-powered incident investigation & safe recovery</div></div><div id="health" class="sub">Checking API…</div></header>
<main><div class="toolbar"><input id="incident" value="INC-002" aria-label="Incident ID"><button id="run">Investigate</button></div><div id="error" class="error"></div>
<section id="result" hidden><div class="card incident-head"><div><div class="eyebrow">Incident</div><div id="incident-id" class="incident-id"></div><div class="muted">Evidence-backed investigation</div></div><div id="status" class="status"></div></div>
<div class="grid"><div class="card"><h2>Root Cause</h2><div id="root"></div></div><div class="card"><h2>Safety Decision</h2><div id="safety"></div></div><div id="approval-card" class="card wide approval-card" hidden><h2>Human Approval Required</h2><div class="muted">Review the proposed recovery plan before allowing the investigation to proceed.</div><input id="reviewer" class="reviewer" placeholder="Reviewer name" aria-label="Reviewer name"><div class="approval-actions"><button id="approve" class="approve">Approve Recovery</button><button id="reject" class="reject">Reject Recovery</button></div></div><div class="card wide"><h2>Recovery Plan</h2><div id="recovery"></div></div><div class="card wide"><h2>Competing Hypotheses</h2><div id="hypotheses"></div></div><div class="card wide"><h2>Evidence</h2><div id="evidence" class="evidence"></div></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>Math.round(Number(v||0)*100);
const label=v=>String(v??"").replaceAll("_"," ");
function render(data){
  $("result").hidden=false;$("incident-id").textContent=data.incident_id;$("status").textContent=label(data.status).toUpperCase();$("approval-card").hidden=!(data.status==="awaiting_human_approval"&&data.approval_required);
  const r=data.root_cause;
  if(r){
    const h=data.hypotheses.find(x=>x.hypothesis_id===r.hypothesis_id);
    $("root").innerHTML='<div class="root-id">'+esc(r.hypothesis_id)+'</div><div class="root-title">'+esc(h?h.statement:"Adjudicated root-cause hypothesis")+'</div><div class="rationale">'+esc(r.rationale)+'</div><div class="confidence-row"><div class="confidence">'+pct(r.confidence)+'%</div><div class="confidence-label">Confidence</div></div><div class="progress"><span style="width:'+pct(r.confidence)+'%"></span></div><div class="facts"><div class="fact"><b class="'+(r.temporal_support?"ok":"")+'">'+(r.temporal_support?"✓":"—")+'</b><span>Temporal support</span></div><div class="fact"><b class="'+(r.causal_support?"ok":"")+'">'+(r.causal_support?"✓":"—")+'</b><span>Causal support</span></div><div class="fact"><b class="'+(r.recovery_support?"ok":"")+'">'+(r.recovery_support?"✓":"—")+'</b><span>Recovery support</span></div></div>';
  }else $("root").innerHTML="<span class='muted'>No adjudicated root cause.</span>";
  const s=data.safety_decision;
  $("safety").innerHTML=s?'<div class="safety-decision">'+esc(label(s.decision).toUpperCase())+'</div><span class="risk">'+esc(s.risk_level)+' risk</span><div class="safety-text">'+esc(s.rationale)+'</div>'+(s.approval_required?'<div class="approval">⚠ Explicit human approval required</div>':'<div class="ok">✓ No human approval required</div>'):"<span class='muted'>No safety decision.</span>";
  const p=data.recovery_plan;
  if(p){
    let steps=p.steps.map((x,i)=>'<div class="step"><div class="step-num">'+(i+1)+'</div><div><div class="step-title">'+esc(x.action)+'</div><div class="step-purpose">'+esc(x.purpose)+'</div></div><span class="badge '+(x.requires_approval?"warn":"")+'">'+esc(x.risk)+(x.requires_approval?" · approval":"")+'</span></div>').join("");
    $("recovery").innerHTML='<div class="muted" style="margin-bottom:12px">Readiness: <b style="color:var(--text)">'+esc(label(p.readiness))+'</b></div><div class="safety-text">'+esc(p.rationale)+'</div><div class="steps">'+steps+'</div>';
  }else $("recovery").innerHTML="<span class='muted'>No recovery plan.</span>";
  $("hypotheses").innerHTML=data.hypotheses.length?'<div class="hypotheses">'+data.hypotheses.map((h,i)=>{
    const support=h.supporting_evidence.length?h.supporting_evidence.map(x=>'<span class="chip">'+esc(x)+'</span>').join(""):"<span class='muted'>None</span>";
    const causal=h.causal_relationships.length?h.causal_relationships.map(x=>'<span class="chip">'+esc(x.role)+' · '+esc(x.source)+' · '+pct(x.strength)+'%</span>').join(""):"<span class='muted'>None</span>";
    return '<details class="hypothesis" '+(i===0?"open":"")+'><summary><div class="hyp-head"><span class="hyp-id">'+esc(h.hypothesis_id)+'</span><div><div class="hyp-statement">'+esc(h.statement)+'</div><div class="hyp-status">'+esc(h.status)+'</div><div class="hyp-bar"><span style="width:'+pct(h.confidence)+'%"></span></div></div><span class="hyp-score">'+pct(h.confidence)+'%</span></div></summary><div class="hyp-details"><p>Supporting evidence</p><div class="chips">'+support+'</div><p>Causal relationships</p><div class="chips">'+causal+'</div></div></details>';
  }).join("")+'</div>':"<span class='muted'>No hypotheses.</span>";
  $("evidence").innerHTML=data.evidence.length?data.evidence.map(e=>'<div class="evidence-item"><div class="evidence-top"><span class="type">'+esc(e.evidence_type)+'</span><span class="source">'+esc(e.source)+'</span></div><div class="observation">'+esc(e.observation)+'</div>'+(e.timestamp?'<div class="time">'+esc(e.timestamp)+'</div>':"")+'</div>').join(""):"<span class='muted'>No evidence.</span>";
}
async function submitApproval(approved){
  const reviewer=$("reviewer").value.trim();
  if(!reviewer){$("error").textContent="Reviewer name is required.";return}
  $("approve").disabled=true;$("reject").disabled=true;$("error").textContent="";
  try{
    const res=await fetch("/api/v1/investigations/"+encodeURIComponent($("incident-id").textContent)+"/approval",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({approved,reviewer})});
    const data=await res.json();if(!res.ok)throw new Error(data.detail||"Approval failed");
    render(data);$("approval-card").hidden=true;
  }catch(e){$("error").textContent=e.message}
  finally{$("approve").disabled=false;$("reject").disabled=false}
}
async function investigate(){
  $("error").textContent="";$("run").disabled=true;$("run").textContent="Investigating…";
  try{const res=await fetch("/api/v1/investigations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({incident_id:$("incident").value.trim()})});const data=await res.json();if(!res.ok)throw new Error(data.detail||"Investigation failed");render(data)}
  catch(e){$("error").textContent=e.message}finally{$("run").disabled=false;$("run").textContent="Investigate"}
}
$("run").addEventListener("click",investigate);$("approve").addEventListener("click",()=>submitApproval(true));$("reject").addEventListener("click",()=>submitApproval(false));
fetch("/health").then(r=>r.ok?$("health").innerHTML='<span class="online"><span class="dot"></span>API online</span>':Promise.reject()).catch(()=>$("health").textContent="API unavailable");
investigate();
</script></body></html>
