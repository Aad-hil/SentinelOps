[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelops"
version = "0.1.0"
description = "AI-powered incident investigation and response platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Muhamed Aadhil" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "simulator*",
    "agents*",
    "tools*",
    "rag*",
    "memory*",
    "graph*",
    "evaluation*",
    "observability*",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 88
target-version = "py313"
